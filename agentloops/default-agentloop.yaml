name: "default-agentloop"
description: "PurrCat 默认 Agent Loop（范式）：注入规则/信息/灵魂/记忆，并在循环结束时校验 Memo 工具调用。"
description-en: "Default PurrCat agent loop (paradigm): injects rules/info/soul/memory and verifies the Memo tool call at loop end."
path: "agent_vm"
loop_end_max_retry: 3
trigger:
  - cron:
      time: "08:08"
      injection: "【Demo】闹钟响了"
  - cron:
      time: "12:00"
      injection: "【Demo】该吃饭了"
hooks:
  on_build_system_prompt:
    - injection:
        content: "@RULES"
    - injection:
        content: "@INFO"
    - injection:
        content: "@SOUL"
    - injection:
        content: "@MEMORY"
    - memo_injection:
        type: "full"
        count: 10
    - injection:
        content: "@SYS"
  on_loop_start:
    - injection: 
        content: "如遇复杂任务，请先编排好主线路的执行计划，先规划TODO后执行"
  on_loop_epoch:
    - injection:
        delay: 5
        content: "[system regular hint]在执行任务前可使用 Search 工具和 Memo 工具搜索有无对应的能力与历史经验"
    - injection:
        interval: 10
        content: "[system regular hint]请随时按进度更新主路规划或与用户对齐需求，防止跑偏"
  on_loop_end:
    # only ALL check passed can exit the loop
    - tool_use_check:
        name: "Memo"
        parameter_check:
          - action: "add"
        failed_prompt: "检查到本轮对话你未调用 Memo 工具进行记忆总结，最好总结一下，让你的能力随记忆系统的丰富而增强，如无经验更新，可添加短期记忆以免会话切换时失忆"
